extends: default

rules:
  indentation:
    spaces: 2
    indent-sequences: true
  line-length: disable
  truthy:
    allowed-values: ["true", "false"]
    check-keys: true
  quoted-strings:
    quote-type: double
    required: only-when-needed
  comments:
    require-starting-space: true
    min-spaces-from-content: 1
  document-start: disable
