<title id="title">Mekan&apos;s Desk / languages</title>
<desc id="desc">Language byte share across eligible owned public + authorized private: TypeScript 41.9%, Python 27.2%, JavaScript 12.5%, Dart 4.4%, C++ 4.1%, Astro 3.0%, QML 2.1%, Svelte 1.5%, SCSS 1.2%, Other 2.1%. Other includes: Shell, MDX, Go, Rust, PowerShell, PHP, QMake, Lua, Dockerfile, Ruby, CMake, Perl, Just, Common Lisp, C, NSIS, Racket, Swift, Tcl, Kotlin, Batchfile, Objective-C.</desc>
