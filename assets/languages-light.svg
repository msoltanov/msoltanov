<title id="title">Mekan&apos;s Desk / languages</title>
<desc id="desc">Language byte share across eligible owned public + authorized private: TypeScript 38.8%, Python 24.2%, JavaScript 20.2%, Dart 4.0%, C++ 3.7%, Astro 2.7%, QML 2.0%, Svelte 1.4%, SCSS 1.1%, Other 1.9%. Other includes: Shell, MDX, Go, Rust, PowerShell, PHP, QMake, Lua, Dockerfile, Ruby, CMake, Perl, Inno Setup, Just, Common Lisp, C, Racket, Swift, Tcl, NSIS, Kotlin, Batchfile, Objective-C.</desc>
