version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: stylelint
        update-types: [version-update:semver-major]
      - dependency-name: stylelint-config-standard
        update-types: [version-update:semver-major]
