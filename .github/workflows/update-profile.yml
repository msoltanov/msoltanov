name: Update Mekan's Desk

"on":
  schedule:
    - cron: 7 0 * * *
      timezone: Asia/Ashgabat
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"
      - run: python -m pip install --requirement requirements-style.txt
      - run: npm ci --ignore-scripts
      - name: Record runtime versions
        run: |
          node -p "JSON.stringify(process.versions)"
          python --version
          npm ls @resvg/resvg-js --depth=0
      - run: npm test
      - name: Restore encrypted activity cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/activity.bin
          key: activity-${{ github.run_id }}
          restore-keys: activity-
      - name: Collect safe statistics and render assets
        run: npm run generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          PROFILE_EXCLUDE_REPOSITORIES: ${{ secrets.PROFILE_EXCLUDE_REPOSITORIES }}
      - name: Save encrypted activity cache
        if: always() && hashFiles('.cache/activity.bin') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/activity.bin
          key: activity-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run check
      - name: Commit changed assets
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -A -- assets README.md data/stats.json
          if git diff --cached --quiet; then
            echo 'Profile assets unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile statistics'
          gh auth setup-git
          git push origin "HEAD:${PROFILE_DEFAULT_BRANCH}"
